/* v0.5: diseño móvil centrado en el mapa */

function historyDate(value){
 const v=String(value||'').trim();
 let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 const months={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
 m=v.toLowerCase().match(/^(\d{1,2})\s+([a-záéíóú]{3,})\s+(\d{4})/);
 if(m&&months[m[2].slice(0,3)])return `${m[3]}-${String(months[m[2].slice(0,3)]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 return /^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):'';
}

ulario de demostración');closeModal()">Guardar ejemplo</button><button class="btn ghost block" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`)}function start(id){
 const station=findStationById(id);if(!station)return;const electric=data.fuel==='Eléctrico';if(electric?!(station.evFree>0):!(station.free>0)){toast('Selecciona una estación compatible y disponible');return}
 if(!reserveStation(station,electric)){toast('El punto acaba de ocuparse. Prueba otro.');render();return;}
 simulation={id,phase:'camera',cameraStatus:'scan',nfcStatus:'idle',vehicle:null,fuel:null,pump:'Surtidor 2',seconds:0,liters:0,amount:0,holding:false,rate:0.7,lastTick:0,authMode:nextAuthMode(),authStatus:'idle',authMethod:null,authNonce:'',authSteps:0};
 go('Repostaje');

}
const DEMO_VEHICLES=[{name:'Moto principal',model:'Yamaha XMAX 300',plate:'1234 MTR',fuel:'Gasolina 95',emoji:'🛵'},{name:'Coche familiar',model:'SEAT Ateca',plate:'5678 KLP',fuel:'Diésel',emoji:'🚙'},{name:'Coche eléctrico',model:'Tesla Model 3',plate:'9012 EVG',fuel:'Eléctrico',emoji:'🔋'}];
const fuelTypes=[{name:'Gasolina 95',icon:'⛽',color:'#0A7459'},{name:'Diésel',icon:'⛽',color:'#1d7e55'}];
function simulationBack(){stopHolding();if(typeof chargeTimer!=='undefined')clearInterval(chargeTimer);releaseStation();simulation=null;go('Home')}
function cameraRecognize(){
 if(!simulation||simulation.phase!=='camera')return;
 const v=([data.customVehicle,...DEMO_VEHICLES].filter(Boolean)).find(v=>v.name===data.vehicle)||DEMO_VEHICLES[0];

// Diez escenarios equilibrados por ciclo, orden aleatorio y persistente.
const AUTH_MODES=['automatic','automatic','automatic','automatic','automatic','automatic','confirm','confirm','confirm','fallback'];
function nextAuthMode(){
 let cycle;try{cycle=JSON.parse(localStorage.getItem('gasgo_auth_cycle')||'null')}catch(e){}
 if(!cycle||!Array.isArray(cycle.queue)||!cycle.queue.length){let queue=AUTH_MODES.slice();for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}cycle={queue,completed:(cycle?.completed||0)}}
 const mode=cycle.queue.shift();cycle.completed++;localStorage.setItem('gasgo_auth_cycle',JSON.stringify(cycle));return mode;
}
function nfcVerify(){
 if(!simulation||simulation.phase!=='recognized')return;
 simulation.phase='security';simulation.authStatus='checking';simulation.authSteps=0;
 simulation.authNonce='GG-'+Math.random().toString(36).slice(2,10).toUpperCase();render();
 const ref=simulation;
 [650,1350,2100].forEach((ms,i)=>setTimeout(()=>{if(simulation!==ref||ref.phase!=='security'||ref.authStatus!=='checking')return;ref.authSteps=i+1;if(i===2){ref.authStatus=ref.authMode==='automatic'?'verified':ref.authMode==='confirm'?'needs-confirm':'needs-fallback'}render()},ms));
}
function confirmPump(){if(!simulation||simulation.phase!=='security'||simulation.authStatus!=='needs-confirm')return;simulation.authMethod='BLE + token firmado + confirmación surtidor';simulation.authStatus='verified';render()}
function fallbackVerify(method){
 if(!simulation||simulation.phase!=='security'||simulation.authStatus!=='needs-fallback')return;
 simulation.authMethod=method+' (simulado)';
 simulation.authStatus=method==='NFC'?'checking-fallback-nfc':'checking-fallback-qr';
 render();
 const ref=simulation;
 setTimeout(()=>{
  if(simulation!==ref||ref.phase!=='security'||!['checking-fallback-nfc','checking-fallback-qr'].includes(ref.authStatus))return;
  ref.authStatus='verified';
  render();
 },method==='NFC'?1500:1850)
}
function nfcProceed(){if(simulation?.phase==='security'&&simulation.authStatus==='verified'){simulation.phase=simulation.vehicle.fuel==='Eléctrico'?'charging':'nozzle';render()}}
function forceAuthMode(mode){if(!simulation||simulation.phase!=='security')return;simulation.authMode=mode;simulation.authStatus='checking';simulation.authSteps=0;nfcVerifyRestart()}
function nfcVerifyRestart(){let ref=simulation;if(!ref)return;ref.authStatus='checking';ref.authSteps=0;render();[400,850,1350].forEach((ms,i)=>setTimeout(()=>{if(simulation!==ref||ref.phase!=='security'||ref.authStatus!=='checking')return;ref.authSteps=i+1;if(i===2)ref.authStatus=ref.authMode==='automatic'?'verified':ref.authMode==='confirm'?'needs-confirm':'needs-fallback';render()},ms))}
function cameraRetry(){if(simulation?.phase!=='recognized')return;simulation.phase='camera';simulation.vehicle=null;render();const ref=simulation;setTimeout(()=>{if(simulation===ref&&simulation.phase==='camera')cameraRecognize()},2200)}

function chooseNozzle(name){
 if(!simulation||simulation.phase!=='nozzle')return;
 simulation.fuel=name;

 simulation.phase='fueling';render();
}
function currentPrice(){let s=findStationById(simulation.id);return simulation.fuel==='Diésel'?s.diesel:s.gas}
function simulatedConsumption(){
 let m=simulation;if(!m||m.phase!=='fueling'||!m.holding)return;
 if(m.emergencyStopped)return;
 let now=performance.now();let seconds=Math.max(0,Math.min((now-m.lastTick)/1000,0.2));m.lastTick=now;
 m.seconds+=seconds;m.liters+=seconds*m.rate;m.amount=m.liters*currentPrice();updateFuelDisplay();
}
function updateFuelDisplay(){const m=simulation;if(!m)return;
 const liters=$('litersValue'),amount=$('amountValue'),time=$('timeValue');
 if(liters)liters.textContent=m.liters.toFixed(2)+' L';
 if(amount)amount.textContent=euro(m.amount);
 if(time)time.textContent=m.seconds.toFixed(1)+' s';

}
let holdTimer=null;
function startHolding(ev){
 if(!simulation||simulation.phase!=='fueling'||simulation.holding||simulation.emergencyStopped)return;
 if(ev&&ev.cancelable)ev.preventDefault();
 simulation.holding=true;simulation.lastTick=performance.now();
 const button=$('holdFuel');if(button){button.classList.add('holding');button.textContent='⛽ Suministrando...';if(ev&&ev.pointerId!==undefined){try{button.setPointerCapture(ev.pointerId)}catch(e){}}}
 const led=$('pumpStateText');if(led)led.textContent='Suministrando';
 clearInterval(holdTimer);holdTimer=setInterval(simulatedConsumption,50);
}
function stopHolding(){
 if(!simulation)return;
 if(simulation.holding)simulatedConsumption();
 simulation.holding=false;clearInterval(holdTimer);holdTimer=null;
 const b=$('holdFuel');if(b){b.classList.remove('holding');b.textContent='⛽ Mantén pulsado para repostar';}
 const led=$('pumpStateText');if(led)led.textContent=simulation.emergencyStopped?'Parada de emergencia':'En espera';
}
function emergencyPumpStop(){if(!simulation||simulation.phase!=='fueling')return;stopHolding();simulation.emergencyStopped=true;render();}
function resumePump(){if(!simulation||simulation.phase!=='fueling'||!simulation.emergencyStopped)return;simulation.emergencyStopped=false;render();}

 setTimeout(()=>{if(lastRepostToast===t)lastRepostToast=null;t.remove()},5000);
}
function finishFuel(){
 stopHolding();const m=simulation;
 if(!m||m.phase!=='fueling')return;
 if(m.liters<0.01){toast('Mantén pulsado para suministrar combustible antes de finalizar');return;}
 m.liters=Number(m.liters.toFixed(2));m.unitPrice=currentPrice();m.subtotal=Number((m.liters*m.unitPrice).toFixed(2));
 const offerResult=window.GGRewards?GGRewards.quote(m.fuel,m.unitPrice,m.liters):{subtotal:m.subtotal,discount:0,amount:m.subtotal,promoId:null};
 m.discount=offerResult.discount;m.amount=offerResult.amount;m.payment=data.payment;
 const station=findStationById(m.id);
 const receipt={id:'GG-'+Date.now().toString(36).toUpperCase(),invoiceNumber:'SIM-2026-'+String(data.history.length+1).padStart(5,'0'),date:new Date().toLocaleString('es-ES'),station:station.name,stationId:station.id,stationArea:station.area,stationLat:station.lat,stationLng:station.lng,pump:m.pump,amount:m.amount,subtotal:m.subtotal,discount:m.discount,unitPrice:m.unitPrice,liters:m.liters,vehicle:m.vehicle.name,plate:m.vehicle.plate,payment:m.payment,fuel:m.fuel,paymentStatus:'Pago ficticio aprobado (automático)',promoId:offerResult.promoId,promoLabel:window.GGRewards?.label(offerResult.promoId)||'',customer:data.profile?data.profile.first+' '+data.profile.last:DEMO_FISCAL.customer,customerNif:data.profile?.dni||DEMO_FISCAL.customerNif,customerAddress:data.profile?.address||DEMO_FISCAL.customerAddress};
 if(window.GGRewards)GGRewards.record(receipt);data.history.push(receipt);save();
 releaseStation();simulation=null;go('Home');showRepostNotification(receipt.amount,receipt.id);
 // El registro contable y el recibo no interrumpen al usuario: ambos se consultan en Historial.
}
let chargeTimer=null;
function toggleCharge(){const m=simulation;if(!m||m.phase!=='charging')return;m.charging=!m.charging;clearInterval(chargeTimer);if(m.charging){chargeTimer=setInterval(()=>{if(simulation!==m||m.phase!=='charging'){clearInterval(chargeTimer);return}const s=findStationById(m.id);m.seconds=(m.seconds||0)+1;m.energy=Math.min(80,(m.energy||0)+s.kw/60);m.amount=Number((m.energy*s.ev).toFixed(2));const e=$('chargeEnergy'),a=$('chargeAmount'),t=$('chargeTime');if(e)e.textContent=m.energy.toFixed(2);if(a)a.textContent=euro(m.amount);if(t)t.textContent=m.seconds;if(m.energy>=80){m.charging=false;clearInterval(chargeTimer);render()}},1000)}render()}
function finishCharge(){const m=simulation;if(!m||m.phase!=='charging')return;clearInterval(chargeTimer);m.charging=false;if(!m.energy){toast('Inicia la carga antes de finalizar');return}const s=findStationById(m.id);const quote=window.GGRewards?GGRewards.quote('Eléctrico',s.ev,m.energy):{subtotal:m.amount,discount:0,amount:m.amount,promoId:null};const r={id:'GG-EV-'+Date.now(),invoiceNumber:'SIM-EV-'+String(data.history.length+1).padStart(5,'0'),date:new Date().toLocaleString('es-ES'),station:s.name,stationId:s.id,stationArea:s.area,stationLat:s.lat,stationLng:s.lng,pump:'Punto CCS2',amount:quote.amount,subtotal:quote.subtotal,discount:quote.discount,unitPrice:s.ev,promoId:quote.promoId,promoLabel:window.GGRewards?.label(quote.promoId)||'',liters:0,energy:Number(m.energy.toFixed(2)),vehicle:m.vehicle.name,plate:m.vehicle.plate,payment:data.payment,fuel:'Electricidad',paymentStatus:'Pago ficticio aprobado (automático)',customer:data.profile?data.profile.first+' '+data.profile.last:DEMO_FISCAL.customer,customerNif:data.profile?.dni||DEMO_FISCAL.customerNif,customerAddress:data.profile?.address||DEMO_FISCAL.customerAddress};if(window.GGRewards)GGRewards.record(r);data.history.push(r);save();releaseStation();simulation=null;go('Home');showRepostNotification(r.amount,r.id)}
function finishAndHome(){releaseStation();simulation=null;go('Home')}
function simulate(){
 let m=simulation;if(!m)return home();let s=STATIONS.find(x=>x.id===m.id);
 let heading=title(m.vehicle?.fuel==='Eléctrico'?'Simulación de recarga':'Simulación de repostaje',s.name);
 let note=`<div class="notice">Prototipo: cámaras, matrículas, BLE, UWB, tokens, NFC, QR, mangueras y cobros son ficticios. No se accede a cámaras, radios inalámbricas, surtidores ni servicios de pago reales.</div>`;
 const step={camera:1,recognized:1,security:2,nozzle:3,charging:4,fueling:4,payment:4,done:4}[m.phase];
 let progress=`<div class="steps">${['Cámara','Seguridad','Manguera','Repostaje'].map((x,i)=>`<span class="step ${step===i+1?'current':step>i+1?'finished':''}">${i+1}. ${x}</span>`).join('')}</div>`;
 let block='';
 if(m.phase==='camera')block=`<div class="card soft center"><span class="pill yellow">● Cámara de demostración</span><h2>Detectando vehículo</h2><div class="sim-visual"><div class="sim-camera-corners"></div><div class="sim-scanline"></div><small>Cámara de entrada · SIMULACIÓN</small><span class="sim-car">🚘</span><div class="sim-plate pending">•••• •••</div><small>Analizando matrícula y vehículo…</small></div><div class="sim-status"><span class="sim-dot"></span><div><b>Reconocimiento en curso</b><br><span class="muted">Buscando coincidencia con el garaje del usuario</span></div></div><p class="small muted">No se accede a ninguna cámara real. La identificación utiliza el vehículo de prueba guardado.</p></div>`;
 if(m.phase==='recognized')block=`<div class="card soft center"><span class="pill green">✓ Vehículo detectado (simulación)</span><div class="sim-visual"><div class="sim-camera-corners ok"></div><div class="sim-scanline"></div><small>Coincidencia encontrada</small><span class="sim-car">${m.vehicle.emoji}</span><div class="sim-plate">${m.vehicle.plate}</div><small>${m.vehicle.model}</small></div><div class="sim-status ok"><span class="sim-dot"></span><div><b>Matrícula y modelo coincidentes</b><br>Vehículo vinculado: ${m.vehicle.name} · ${m.vehicle.fuel}</div></div><button class="btn primary block" onclick="nfcVerify()">Continuar a verificación →</button><button class="sim-link" onclick="cameraRetry()">↻ Repetir detección simulada</button><p class="small muted">La coincidencia proviene del garaje ficticio de GAS&GO.</p></div>`;
 if(m.phase==='security'){
 const modeName={automatic:'BLE + UWB + token firmado',confirm:'BLE + token firmado + confirmación',fallback:'NFC o QR dinámico'}[m.authMode];
 const verified=m.authStatus==='verified';
 const steps=[['Matrícula y vehículo',true],['Dispositivo autorizado',m.authSteps>=1],['Token vinculado a la sesión',m.authSteps>=2],['Surtidor 2 · prueba de proximidad',m.authSteps>=3&&m.authMode==='automatic']];
 block=`<div class="card soft"><div class="center"><span class="pill ${verified?'green':m.authStatus==='needs-fallback'?'yellow':''}">${verified?'✓ Validación completa':m.authStatus==='needs-fallback'?'⚠ No se puede completar automáticamente':'◉ GAS&GO Secure Token'}</span><h2>${verified?'Surtidor autorizado':m.authStatus==='needs-confirm'?'Confirma el surtidor':m.authStatus==='needs-fallback'?'Verificación alternativa':'Verificando usuario y surtidor'}</h2><p class="small muted">${modeName} · demostración</p><div style="font-size:52px;margin:12px 0">${verified?'✅':m.authStatus==='needs-fallback'?'🔐':'📡'}</div></div><div class="authchecks">${steps.map(([label,ok])=>`<div class="authcheck"><span>${label}</span><b>${ok?'✓': '·'}</b></div>`).join('')}</div><div class="auth-id"><b>Sesión vinculada a ${m.pump}</b><div class="small muted">Token de demostración: ${m.authNonce}</div><div class="small muted">No es un token criptográfico real.</div></div>${verified?`<div class="sim-status ok"><span class="sim-dot"></span><div><b>Vehículo, usuario y surtidor autorizados</b><br><span class="small muted">${m.authMethod||modeName}</span></div></div><button class="btn primary block" onclick="nfcProceed()">Elegir manguera →</button>`:m.authStatus==='needs-confirm'?`<div class="notice">Se ha detectado el dispositivo mediante BLE. Para vincular la operación al surtidor correcto, confirma el número indicado en el equipo físico: <b>${m.pump}</b>.</div><button class="btn primary block" onclick="confirmPump()">Confirmar ${m.pump} (simulación)</button>`:m.authStatus==='needs-fallback'?`<div class="notice">La verificación automática no se ha completado. El suministro permanece bloqueado hasta completar una alternativa.</div><div class="btnrow"><button class="btn primary" onclick="fallbackVerify('NFC')">Simular NFC</button><button class="btn ghost" onclick="fallbackVerify('QR dinámico')">Simular QR</button></div>`:m.authStatus==='checking-fallback-nfc'?`<div class="notice">Acerca el dispositivo a la pantalla del surtidor.</div><div class="card soft center" style="margin:12px 0 0;padding:18px"><div style="font-size:54px;margin:4px 0 10px">📲</div><b>Acerca el dispositivo a la pantalla del surtidor</b><p class="small muted" style="margin:8px 0 0">Validando lector NFC simulado…</p></div>`:m.authStatus==='checking-fallback-qr'?`<div class="notice">Abre la cámara ficticia para escanear el QR.</div><div class="card soft center" style="margin:12px 0 0;padding:18px"><div class="sim-visual" style="margin:0 auto;max-width:220px"><div class="sim-camera-corners"></div><div class="sim-scanline"></div><small>Cámara ficticia abierta</small><div style="font-size:58px;line-height:1;margin:14px 0 10px">▣</div><small>Escaneando QR del surtidor…</small></div></div>`:`<div class="sim-status"><span class="sim-dot"></span><b>Comprobando sesión, cuenta y proximidad…</b></div>`}<details style="margin-top:15px"><summary class="small muted">Opciones de evaluación (solo demo)</summary><p class="small muted">Cambiar el escenario de esta prueba no modifica la proporción del ciclo de 10 llegadas.</p><div class="auth-choices"><button onclick="forceAuthMode('automatic')">Ruta A</button><button onclick="forceAuthMode('confirm')">Ruta B</button><button onclick="forceAuthMode('fallback')">Ruta C</button></div></details><p class="small muted" style="margin-top:13px">Las conexiones BLE, UWB, tokens firmados, NFC y QR son ficticios. Sin enlaces físicos ni pagos reales.</p></div>`;
 }
 if(m.phase==='nozzle')block=`<div class="card soft"><span class="pill green">✓ Identidad verificada · ${m.pump}</span><h2>Escoge la manguera</h2><p class="muted">Selecciona el combustible que corresponde al vehículo <b>${m.vehicle.model}</b>.</p><div class="fuel-options">${fuelTypes.map(f=>`<button class="fuel-option ${f.name!==m.vehicle.fuel?'incompatible':''}" onclick="chooseNozzle('${f.name}')"><span class="circle">${f.icon}</span><span><b>${f.name}</b><small>${euro(f.name==='Diésel'?s.diesel:s.gas)}/L</small></span>${f.name===m.vehicle.fuel?'<span class="pill green">Compatible</span>':'<span class="pill">No compatible</span>'}</button>`).join('')}</div><p class="small muted">En una estación real, el usuario deberá escoger físicamente la manguera. Esta pantalla representa su elección.</p></div>`;
 if(m.phase==='fueling')block=`<div class="card soft"><div class="center"><span class="pill green">✓ ${m.fuel} · ${m.pump}</span><h2>Surtidor virtual</h2><p class="small muted">Acciona la manguera manteniendo pulsado. Al soltar, el flujo se detiene.</p></div><div class="virtual-pump"><div class="pump-top"><span>⛽ GAS&GO · ${m.pump}</span><span class="pump-indicator"><i class="pump-led ${m.emergencyStopped?'off':''}"></i><span id="pumpStateText">${m.emergencyStopped?'Parada de emergencia':m.holding?'Suministrando':'En espera'}</span></span></div><div class="pump-screen"><div class="pump-metrics"><div><div class="pump-label">Importe (€)</div><div class="pump-main-value" id="amountValue">${euro(m.amount)}</div></div><div><div class="pump-label">Volumen (L)</div><div class="pump-main-value" id="litersValue">${m.liters.toFixed(2)} L</div></div></div><div class="pump-data">${euro(currentPrice())}/L · Tiempo: <span id="timeValue">${m.seconds.toFixed(1)} s</span></div></div></div>${m.emergencyStopped?`<div class="pump-stopped">⚠ Suministro detenido por la parada de emergencia simulada.</div><button class="btn pump-resume block" onclick="resumePump()">↻ Reanudar simulación</button>`:`<button id="holdFuel" class="hold-button" onpointerdown="startHolding(event)" onpointerup="stopHolding()" onpointercancel="stopHolding()" onlostpointercapture="stopHolding()" oncontextmenu="event.preventDefault()">⛽ Mantén pulsado para repostar</button><button class="btn pump-stop block" onclick="emergencyPumpStop()">■ Parada de emergencia (simulada)</button>`}<p class="pump-help">Simulación a 0,7 L/s. El botón de emergencia solo afecta al prototipo; en estaciones reales la parada debe estar implementada en el controlador físico.</p><button class="btn dark block" onclick="finishFuel()">Terminar repostaje y volver al mapa</button></div>`;
 if(m.phase==='charging')block=`<div class="card soft"><div class="center"><span class="pill green">⚡ CCS2 · ${m.pump}</span><h2>Recarga eléctrica</h2><p class="small muted">Punto de carga simulado · ${s.kw} kW · ${s.ev.toFixed(2).replace('.',',')} €/kWh</p></div><div class="virtual-pump"><div class="pump-top"><span>⚡ GAS&GO · Carga eléctrica</span><span id="chargeStatus">${m.charging?'● Cargando':'● En espera'}</span></div><div class="pump-screen"><div class="pump-metrics"><div><div class="pump-label">Energía (kWh)</div><div class="pump-main-value" id="chargeEnergy">${(m.energy||0).toFixed(2)}</div></div><div><div class="pump-label">Importe (€)</div><div class="pump-main-value" id="chargeAmount">${euro(m.amount)}</div></div></div><div class="pump-data">${s.ev.toFixed(2).replace('.',',')} €/kWh · Tiempo simulado: <span id="chargeTime">${(m.seconds||0).toFixed(0)}</span> min</div></div></div><p class="small muted">Demostración acelerada: 1 segundo representa 1 minuto. La carga puede pausarse o terminarse cuando quieras.</p><button class="btn primary block" onclick="toggleCharge()">${m.charging?'⏸ Pausar carga':'⚡ Iniciar / continuar carga'}</button><button class="btn dark block" style="margin-top:10px" onclick="finishCharge()">Finalizar recarga y volver al mapa</button></div>`;
 return heading+note+progress+block+(!['done','payment'].includes(m.phase)?`<button class="btn ghost block" style="margin-top:12px" onclick="simulationBack()">Cancelar simulación</button>`:'');
}
